apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-sentinel-deployment
  labels:
    app: cloud-sentinel-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cloud-sentinel-app
  template:
    metadata:
      labels:
        app: cloud-sentinel-app
    spec:
      containers:
        - name: cloud-sentinel-container
          image: cloud-sentinel:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          envFrom:
            - secretRef:
                name: aws-creds
          volumeMounts:
            - name: sentinel-data
              mountPath: /data
      volumes:
        - name: sentinel-data
          # emptyDir: {}  # Use an emptyDir volume for ephemeral storage
          persistentVolumeClaim:
            claimName: cloud-sentinel-pvc
          